<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindGate</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">

<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    overflow: hidden;
    position: relative;
  }

  /* ---------- ambient background ---------- */

  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 640px;
    height: 640px;
    transform: translate(-50%, -55%);
    background: radial-gradient(circle, var(--accent-a16) 0%, var(--accent-a05) 40%, transparent 70%);
    filter: blur(10px);
    animation: breathe 7s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -55%) scale(0.94); opacity: 0.75; }
    50%      { transform: translate(-50%, -55%) scale(1.06); opacity: 1; }
  }

  .particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    bottom: -10px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--accent-a55);
    animation-name: drift;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }

  @keyframes drift {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.15; }
    100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
  }

  /* ---------- content ---------- */

  .stage {
    position: relative;
    z-index: 1;
    max-width: 560px;
    width: 100%;
    text-align: center;
    animation: fadeIn 1.1s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .mark {
    width: 56px;
    height: auto;
    margin: 0 auto 28px;
    display: block;
    /* Icon fill itself stays as shipped in the asset (off-white);
       only the glow behind it is amber-red now. */
    filter: drop-shadow(0 0 18px var(--accent-a45));
    animation: markFloat 7s ease-in-out infinite;
  }

  @keyframes markFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }

  .headline {
    font-family: var(--font-heading);
    font-style: normal;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.01em;
    color: var(--text-primary);
    margin: 0 0 40px;
  }

  .quote-block {
    margin: 0 0 44px;
    min-height: 96px;
  }

  /* Quote text — the ONLY place Instrument Serif appears */
  .quote {
    font-family: var(--font-quote);
    font-style: italic;
    font-weight: 400;
    font-size: 21px;
    line-height: 1.65;
    color: var(--text-primary);
    margin: 0 0 16px;
  }

  .quote-author {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.85;
  }

  .divider {
    width: 40px;
    height: 1px;
    margin: 0 auto 28px;
    background: linear-gradient(90deg, transparent, var(--accent-a50), transparent);
  }

  .status {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  /* Countdown / lock status value — system status data, kept bold
     off-white on purpose (NOT tinted amber-red, per spec). */
  .status-value {
    color: var(--text-primary);
    font-weight: 700;
  }

  .footer {
    position: fixed;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 1;
  }

  .footer-brand {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }

  .footer-tag {
    font-family: var(--font-body);
    font-style: italic;
    font-size: 11px;
    color: var(--text-secondary-dim);
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px) {
    .headline { font-size: 23px; }
    .quote { font-size: 18px; }
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="particles" id="particles"></div>

  <div class="stage">
    <img class="mark" src="icons/icon128.png" alt="MindGate">
    <h1 class="headline">This page is protected.</h1>

    <div class="quote-block">
      <p class="quote" id="quote">&nbsp;</p>
      <div class="quote-author" id="quote-author"></div>
    </div>

    <div class="divider"></div>

    <div class="status">
      Protection Status:  &nbsp; <span class="status-value" id="status-value">&mdash;</span>
    </div>
  </div>

  <div class="footer">
    <div class="footer-brand">MindGate</div>
    <div class="footer-tag">Protect your future self.</div>
  </div>

  <script src="block.js"></script>
</body>
</html>
