<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindGate</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: #fff0f5;
    color: #4a2c3a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    max-width: 460px;
    width: 100%;
    background: #ffffff;
    padding: 48px 40px;
    border-radius: 20px;
    border: 1px solid #f7c5d8;
    box-shadow: 0 20px 40px -12px rgba(244, 114, 182, 0.25);
    text-align: center;
    animation: fadeIn 0.6s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    font-size: 40px;
    line-height: 1;
    margin-bottom: 12px;
  }

  .brand {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #d6336c;
    margin-bottom: 28px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 24px;
    color: #4a2c3a;
  }

  .quote {
    font-family: "Snell Roundhand", "Brush Script MT", "Segoe Script", cursive;
    font-size: 22px;
    line-height: 1.5;
    color: #a15b76;
    margin: 0 0 32px;
    min-height: 66px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .divider {
    height: 1px;
    background: #f7c5d8;
    margin: 0 0 24px;
  }

  .lock {
    margin-bottom: 24px;
  }

  .lock-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #c68aa0;
    margin-bottom: 6px;
  }

  .lock-value {
    font-size: 16px;
    font-weight: 600;
    color: #d6336c;
  }

  .cta {
    display: inline-block;
    color: #f472b6;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }

  .cta:hover {
    border-color: #f472b6;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🌸</div>
    <div class="brand">MindGate</div>
    <h1>This page is blocked.</h1>
    <p class="quote" id="quote"></p>
    <div class="divider"></div>
    <div class="lock">
      <div class="lock-label">Current Lock</div>
      <div class="lock-value" id="lock-value">&mdash;</div>
    </div>
    <div class="divider"></div>
    <a href="#" class="cta" id="go-back">Return to what matters.</a>
  </div>
  <script src="block.js"></script>
</body>
</html>
