<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MindGate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="glow"></div>

  <div class="header">
    <img class="mark" src="icons/icon48.png" alt="MindGate">
    <div class="header-text">
      <div class="title">MindGate</div>
      <div class="status">
        <span class="status-dot"></span>
        <span id="status-text">Protection Active</span>
      </div>
    </div>
    <div class="total-badge" id="total-badge" title="Total active rules">
      <span id="total-count">0</span>
      <span class="total-label">rules</span>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- INCOGNITO ACCESS WARNING (hidden by default; -->
  <!-- shown/hidden by popup.js based on a live      -->
  <!-- check, not a stored flag, so it clears itself -->
  <!-- the moment the user flips the setting on)     -->
  <!-- NOTE: colors here are an existing warning-     -->
  <!-- state palette, intentionally left as-is —      -->
  <!-- flagged as a separate concern from the brand   -->
  <!-- accent re-theme (see chat response).           -->
  <!-- ========================================== -->
  <div id="incognito-warning" style="display:none; margin: 8px 12px; padding: 10px 12px; border-radius: 6px; background: #3a2a10; border: 1px solid #7a5a1a; color: #f0d9a8; font-size: 12px; line-height: 1.5;">
    <div style="margin-bottom: 6px;">
      Incognito windows aren't protected yet. Enable
      <strong>"Allow in Incognito"</strong> for MindGate to cover them too.
    </div>
    <button id="incognito-warning-btn" style="background: #7a5a1a; color: #fff; border: none; border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer;">
      Open chrome://extensions
    </button>
  </div>

  <!-- ========================================== -->
  <!-- FLEXIBLE FOCUS LOCK SECTION                -->
  <!-- ========================================== -->
  <div class="section lock-section" id="lock-section">
    <div class="section-header">
      <span class="section-title">Focus Lock</span>
      <span class="count" id="lock-status-text">Unlocked</span>
    </div>

    <!-- UNLOCKED STATE -->
    <div id="lock-controls">
      <div class="lock-presets">
        <button class="lock-btn-sm" data-duration="900">15m</button>
        <button class="lock-btn-sm" data-duration="3600">1h</button>
        <button class="lock-btn-sm" data-duration="14400">4h</button>
        <button class="lock-btn-sm" data-duration="86400">1d</button>
      </div>

      <div class="lock-custom">
        <!-- Added max="180" as the default safe limit for minutes -->
        <input type="number" id="custom-duration" min="1" max="180" placeholder="30" class="custom-input">
        <select id="custom-unit" class="custom-select">
          <option value="60">Minutes</option>
          <option value="3600">Hours</option>
          <option value="86400">Days</option>
          <option value="604800">Weeks</option>
          <option value="2592000">Months</option>
          <option value="31536000">Years</option>
        </select>
        <button id="custom-lock-btn" class="lock-btn-action">Lock</button>
      </div>
    </div>

    <!-- LOCKED STATE -->
    <div id="locked-view" class="locked-view" style="display: none;">
      <div class="timer-display" id="timer-display">00:00:00</div>
      <div class="lock-tagline">Rules are enforced. Stay focused.</div>
    </div>
  </div>
  <!-- ========================================== -->

  <details class="section" id="websites-section" open>
    <summary class="section-header">
      <span class="section-title">Websites</span>
      <span class="count" id="websites-count">0</span>
    </summary>
    <div class="section-body">
      <div class="input-row">
        <input type="text" id="website-input" placeholder="youtube.com" spellcheck="false">
        <button class="add-btn" data-type="website">+</button>
      </div>
      <div class="filter-row" data-filter-for="websites-list">
        <input type="text" class="filter-input" placeholder="Filter websites…" spellcheck="false">
        <span class="filter-shown"></span>
      </div>
      <div class="list" id="websites-list"></div>
    </div>
  </details>

  <details class="section" id="paths-section">
    <summary class="section-header">
      <span class="section-title">Paths</span>
      <span class="count" id="paths-count">0</span>
    </summary>
    <div class="section-body">
      <div class="input-row">
        <input type="text" id="path-input" placeholder="reddit.com/r/gaming" spellcheck="false">
        <button class="add-btn" data-type="path">+</button>
      </div>
      <div class="filter-row" data-filter-for="paths-list">
        <input type="text" class="filter-input" placeholder="Filter paths…" spellcheck="false">
        <span class="filter-shown"></span>
      </div>
      <div class="list" id="paths-list"></div>
    </div>
  </details>

  <details class="section" id="keywords-section">
    <summary class="section-header">
      <span class="section-title">Keywords</span>
      <span class="count" id="keywords-count">0</span>
    </summary>
    <div class="section-body">
      <div class="input-row">
        <input type="text" id="keyword-input" placeholder="nsfw" spellcheck="false">
        <button class="add-btn" data-type="keyword">+</button>
      </div>
      <div class="filter-row" data-filter-for="keywords-list">
        <input type="text" class="filter-input" placeholder="Filter keywords…" spellcheck="false">
        <span class="filter-shown"></span>
      </div>
      <div class="list" id="keywords-list"></div>
    </div>
  </details>

  <details class="section" id="subreddits-section">
    <summary class="section-header">
      <span class="section-title">Subreddits</span>
      <span class="count" id="subreddits-count">0</span>
    </summary>
    <div class="section-body">
      <div class="input-row">
        <input type="text" id="subreddit-input" placeholder="gonewild" spellcheck="false">
        <button class="add-btn" data-type="subreddit">+</button>
      </div>
      <div class="filter-row" data-filter-for="subreddits-list">
        <input type="text" class="filter-input" placeholder="Filter subreddits…" spellcheck="false">
        <span class="filter-shown"></span>
      </div>
      <div class="list" id="subreddits-list"></div>
    </div>
  </details>

  <div class="footer">
    <div class="footer-tag">Protect your future self.</div>
  </div>

  <script src="popup.js"></script>
  <script src="popup-ui.js"></script>
</body>
</html>
