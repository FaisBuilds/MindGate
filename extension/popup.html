<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MindGate</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="glow"></div>

  <div class="header">
    <img class="mark" src="icons/logo.png" alt="MindGate">
    <div class="header-text">
      <div class="title">MindGate</div>
      <div class="status">
        <span class="status-dot"></span>
        <span id="status-text">Protection Active</span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">Websites</span>
      <span class="count" id="websites-count">0</span>
    </div>
    <div class="input-row">
      <input type="text" id="website-input" placeholder="youtube.com" spellcheck="false">
      <button class="add-btn" data-type="website">+</button>
    </div>
    <div class="list" id="websites-list"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">Paths</span>
      <span class="count" id="paths-count">0</span>
    </div>
    <div class="input-row">
      <input type="text" id="path-input" placeholder="reddit.com/r/gaming" spellcheck="false">
      <button class="add-btn" data-type="path">+</button>
    </div>
    <div class="list" id="paths-list"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">Keywords</span>
      <span class="count" id="keywords-count">0</span>
    </div>
    <div class="input-row">
      <input type="text" id="keyword-input" placeholder="nsfw" spellcheck="false">
      <button class="add-btn" data-type="keyword">+</button>
    </div>
    <div class="list" id="keywords-list"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">Subreddits</span>
      <span class="count" id="subreddits-count">0</span>
    </div>
    <div class="input-row">
      <input type="text" id="subreddit-input" placeholder="gonewild" spellcheck="false">
      <button class="add-btn" data-type="subreddit">+</button>
    </div>
    <div class="list" id="subreddits-list"></div>
  </div>

  <div class="footer">
    <div class="footer-tag">Protect your future self.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
